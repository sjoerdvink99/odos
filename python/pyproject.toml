[project]
name = "tracegram"
dynamic = ["version"]
description = "A grammar of agent processes, with declarative views compiled to Vega."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sjoerd Vink" }]
keywords = ["agents", "llm", "traces", "opentelemetry", "visualization", "grammar", "process-mining"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = ["anywidget>=0.9", "pandas>=2.0"]

[project.urls]
Documentation = "https://sjoerdvink99.github.io/tracegram/"
Repository = "https://github.com/sjoerdvink99/tracegram"
Issues = "https://github.com/sjoerdvink99/tracegram/issues"
Changelog = "https://github.com/sjoerdvink99/tracegram/blob/main/CHANGELOG.md"

[project.optional-dependencies]
save = ["mini-racer>=0.12", "vl-convert-python>=1.7"]
dev = [
    "tracegram[save]",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "nbclient>=0.10",
    "ipykernel>=6",
    "pm4py>=2.7",
    "jsonschema>=4",
]
notebook = ["jupyterlab>=4"]
docs = ["zensical>=0.0.73; python_version >= '3.11'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tracegram/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tracegram"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:::pm4py.*", "ignore::DeprecationWarning:py_mini_racer.*", "ignore::PendingDeprecationWarning:numpy.*", "error:::tracegram", "error:::tracegram\\..*"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
