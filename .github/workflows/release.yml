name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version="$(node -p "require('./js/package.json').version")"
          python_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/src/tracegram/__init__.py)"
          echo "tag $tag, npm $npm_version, python $python_version"
          test "$tag" = "$npm_version" && test "$tag" = "$python_version"

  npm:
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tracegram
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: js
      - run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "tracegram@$version" version 2>/dev/null | grep -q .; then
            echo "tracegram@$version is already on npm"
          else
            npm publish --provenance --access public
          fi
        working-directory: js

  pypi:
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tracegram/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build python --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
